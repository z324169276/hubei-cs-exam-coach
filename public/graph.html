<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>知识点图谱 · 计算机类错题工作台</title>
<link rel="stylesheet" href="/style.css" />
<style>
  /* 页面专属布局，颜色/圆角沿用 style.css 的变量 */
  .page { max-width: 1320px; margin: 0 auto; padding: 18px 24px 48px; }

  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: #eef0f4; border-radius: 10px; }
  .tabs button { border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 7px; }
  .tabs button.active {
    background: var(--panel); color: var(--text); font-weight: 600;
    box-shadow: 0 1px 3px rgba(28, 34, 48, .08);
  }

  .graph-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }

  .canvas-card, .detail-card, .filter-card, .weak-card, .cause-card, .stat-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  }
  .canvas-card { padding: 14px 16px 10px; }
  .canvas-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .legend { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--muted); }
  .legend i { width: 9px; height: 9px; border-radius: 3px; margin-right: 4px; display: inline-block; vertical-align: -1px; }
  .dot.lv-none { background: #e8ebf1; border: 1px solid #d5dae4; }
  .dot.lv-weak { background: #f6c9ce; border: 1px solid #e39aa3; }
  .dot.lv-fair { background: #f8e0b6; border: 1px solid #e0bb7c; }
  .dot.lv-solid { background: #b9e3cb; border: 1px solid #86c7a5; }

  .graph-scroll { overflow: auto; margin-top: 8px; }
  .graph-scroll svg { display: block; width: 100%; height: auto; min-width: 760px; }
  .canvas-hint { margin-top: 6px; }

  .module-box { fill: #fafbfd; stroke: #e8ebf1; stroke-width: 1; }
  .module-title { font-size: 12.5px; font-weight: 600; fill: #4a5263; }
  .module-sub { font-size: 10.5px; fill: #9aa2b1; }

  .edge { fill: none; stroke: #b3bfd3; stroke-width: 1.4; }
  .edge.cross { stroke: #c3cee0; stroke-dasharray: 4 4; }
  .edge.hl { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: none; opacity: 1; }
  .edge.dim { opacity: .12; }

  .node { cursor: pointer; }
  .node rect { stroke-width: 1; transition: fill .2s, stroke .2s; }
  .node text { font-size: 12px; fill: #3a4254; pointer-events: none; }
  .node.lv-none rect { fill: #f4f5f7; stroke: #dfe2e8; }
  .node.lv-weak rect { fill: #fdecee; stroke: #e39aa3; }
  .node.lv-fair rect { fill: #fff6e6; stroke: #e0bb7c; }
  .node.lv-solid rect { fill: #e9f7ef; stroke: #86c7a5; }
  .node:hover rect, .node.sel rect { stroke: var(--accent); stroke-width: 2; }

  .detail-card { padding: 14px 16px; position: sticky; top: 82px; }
  .detail-card h3 { margin: 10px 0 4px; font-size: 14px; }
  .detail-card h4 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .detail-meta { font-size: 12px; color: var(--muted); }
  .detail-stat { display: flex; gap: 16px; margin-top: 10px; }
  .detail-stat div { font-size: 11.5px; color: var(--muted); }
  .detail-stat b { display: block; font-size: 17px; color: var(--text); font-variant-numeric: tabular-nums; }
  .rel-list { display: flex; flex-direction: column; gap: 6px; }
  .rel-item {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    font-size: 12px; background: #f7f8fa; border-radius: 7px; padding: 6px 9px; color: #3a4254;
  }
  .rel-item .muted { font-size: 11px; }
  .rel-item .tag { color: var(--accent); }

  .filter-card { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding: 14px 16px; margin-bottom: 14px; }
  .filter-card label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
  .filter-card input { width: 200px; }

  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .stat-box { padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; background: #fbfcfe; }
  .stat-box span { font-size: 24px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat-box span.warn { color: var(--danger); }
  .stat-box label { font-size: 11.5px; color: var(--muted); }

  .weak-card { padding: 14px 16px; margin-bottom: 16px; }
  .weak-card h2 { margin-bottom: 10px; }
  .weak-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 4px; border-top: 1px dashed var(--line); font-size: 13px;
  }
  .weak-row:first-of-type { border-top: 0; }
  .weak-id { font-weight: 600; color: var(--danger); width: 34px; flex: none; }
  .weak-name { flex: 1; min-width: 0; }
  .weak-module { font-size: 11px; color: var(--muted); }
  .bar { width: 110px; height: 6px; border-radius: 999px; background: #eef0f4; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; background: var(--danger); }
  .weak-rate { width: 86px; text-align: right; font-size: 11.5px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }

  .cause-list { display: flex; flex-direction: column; gap: 10px; }
  .cause-card { padding: 12px 14px; }
  .cause-chain { font-size: 13.5px; line-height: 1.8; word-break: break-word; }
  .cause-chain b { color: var(--accent); }
  .cause-chain .arrow { color: var(--muted); padding: 0 3px; }
  .cause-meta { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .cause-meta .contrib { color: var(--danger); }
  .cause-note { margin-top: 6px; font-size: 12px; color: #4a5263; }

  .need-list { display: flex; flex-direction: column; gap: 8px; }
  .need-item { background: #f7f8fa; border-radius: 8px; padding: 9px 11px; font-size: 12.5px; color: #3a4254; }
  .need-item .muted { display: block; margin-top: 2px; font-size: 11.5px; }

  .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 0 0 10px; }

  @media (max-width: 980px) {
    .graph-grid { grid-template-columns: 1fr; }
    .detail-card { position: static; }
    .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .page { padding: 12px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">图</span>
    <div>
      <h1>知识点图谱 · 错因诊断</h1>
      <p class="sub">2026 湖北省技能高考 · 计算机类 · 62 个知识点</p>
    </div>
  </div>
  <div class="actions">
    <div class="tabs" id="tabs">
      <button type="button" class="active" data-tab="graph">知识图谱</button>
      <button type="button" data-tab="diagnose">错因诊断</button>
    </div>
    <a class="btn-link" href="/">返回题库</a>
    <a class="btn-link" href="/wrong">我的错题本</a>
  </div>
</header>

<div class="page">
  <section id="tab-graph" class="graph-grid">
    <div class="canvas-card">
      <div class="canvas-head">
        <h2>知识依赖图</h2>
        <span class="legend">
          <span><i class="dot lv-none"></i>未测</span>
          <span><i class="dot lv-weak"></i>薄弱</span>
          <span><i class="dot lv-fair"></i>待巩固</span>
          <span><i class="dot lv-solid"></i>掌握</span>
        </span>
      </div>
      <div class="graph-scroll"><svg id="graph" role="img" aria-label="知识点依赖图"></svg></div>
      <p class="muted canvas-hint">实线为模块内依赖，浅色虚线为跨模块依赖；鼠标悬停节点可高亮相邻边。</p>
    </div>
    <aside class="detail-card" id="detail">
      <h2>知识点详情</h2>
      <p class="muted" style="margin-top: 8px;">点击左侧任意知识点，查看它的直接前置、直接后继与掌握度。</p>
    </aside>
  </section>

  <section id="tab-diagnose" hidden>
    <div class="filter-card">
      <label>学生姓名<input id="dName" placeholder="留空则统计全部学生" /></label>
      <label>班级<input id="dClass" placeholder="留空则不限班级" /></label>
      <button class="primary" id="btnDiagnose" type="button">开始诊断</button>
      <span class="muted" id="dStatus"></span>
    </div>
    <div id="diagnoseBody">
      <div class="empty">
        <strong>还没有开始诊断</strong>
        填写姓名或班级后点「开始诊断」，也可以都留空统计全部答卷。
      </div>
    </div>
  </section>
</div>

<script src="/graph.js"></script>
</body>
</html>
